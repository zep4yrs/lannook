name: Feature request / 功能建议
description: 提出新功能或改进建议。Suggest a new feature or improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        建议先阅读 [更新计划](docs/roadmap/lannook-update-plan.md)，了解项目方向与「暂不优先开发」的列表（公网中转、复杂账号系统等）。
        Please read the [update plan](docs/roadmap/lannook-update-plan.md) first; it lists directions the project deliberately avoids.
  - type: textarea
    id: problem
    attributes:
      label: "要解决的问题 / Problem"
      description: "这个功能解决什么场景下的什么痛点？现状哪里不够用？"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "建议方案 / Proposed solution"
      description: "你设想的行为、界面或交互是怎样的？"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "替代方案 / Alternatives considered"
      description: "有没有别的实现思路或规避方式？"
  - type: input
    id: device
    attributes:
      label: "受影响端 / Affected side"
      description: "桌面端、手机端，还是两端？"
      placeholder: "手机端"